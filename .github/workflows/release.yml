name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_2[6-9]*.app | sort -V | tail -1)" && xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Test core
        working-directory: Core
        run: swift test

      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          xcodegen generate
          xcodebuild -project Swiftwarden.xcodeproj -scheme Swiftwarden -configuration Release -derivedDataPath build \
            -destination 'generic/platform=macOS' ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO CODE_SIGN_IDENTITY=- \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" build -quiet
          ditto -c -k --keepParent build/Build/Products/Release/Swiftwarden.app "Swiftwarden-$VERSION.zip"
          echo "SHA256=$(shasum -a 256 "Swiftwarden-$VERSION.zip" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "Swiftwarden-$VERSION.zip" --title "Swiftwarden $VERSION" --generate-notes --verify-tag

      - name: Update Homebrew cask
        run: |
          git fetch origin main
          git checkout main
          sed -i '' -E "s/^  version \".*\"/  version \"$VERSION\"/; s/^  sha256 \".*\"/  sha256 \"$SHA256\"/" Casks/swiftwarden.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Cask: Swiftwarden $VERSION" && git push origin main || echo "Cask already up to date"
