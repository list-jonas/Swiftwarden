name: Swiftwarden
options:
  bundleIdPrefix: com.listjonas
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  SwiftwardenCore:
    path: Core
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
targets:
  Swiftwarden:
    type: application
    platform: macOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: SwiftwardenCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: $(PRODUCT_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: Swiftwarden is an unofficial Bitwarden client.
        LSEnvironment:
          MallocSpaceEfficient: "1"
    entitlements:
      path: App/Swiftwarden.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.listjonas.swiftwarden
        PRODUCT_NAME: Swiftwarden
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.listjonas.swiftwarden.dev
          PRODUCT_NAME: Swiftwarden Dev
          PRODUCT_MODULE_NAME: Swiftwarden
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDev
          EXCLUDED_SOURCE_FILE_NAMES: AppIcon.icon
        Release:
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
          EXCLUDED_SOURCE_FILE_NAMES: AppIconDev.icon
          DEPLOYMENT_POSTPROCESSING: YES
          STRIP_INSTALLED_PRODUCT: YES
          STRIP_STYLE: all
          COPY_PHASE_STRIP: YES
          SWIFT_COMPILATION_MODE: wholemodule
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

