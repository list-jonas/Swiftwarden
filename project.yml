name: Swiftwarden
options:
  bundleIdPrefix: com.listjonas
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  SwiftwardenCore:
    path: Core
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
targets:
  Swiftwarden:
    type: application
    platform: macOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: SwiftwardenCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Swiftwarden
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: Swiftwarden is an unofficial Bitwarden client.
    entitlements:
      path: App/Swiftwarden.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.listjonas.swiftwarden
        PRODUCT_NAME: Swiftwarden
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
